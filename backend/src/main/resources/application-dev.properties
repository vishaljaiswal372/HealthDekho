# Local development profile (active by default)
spring.jpa.show-sql=false
logging.level.com.healthDekho=DEBUG
logging.level.org.flywaydb=INFO
# Dev-only signing key (HS256 needs >= 32 bytes). Prod must supply JWT_SECRET; the app refuses to start without it.
healthdekho.security.jwt-secret=${JWT_SECRET:dev-only-healthdekho-jwt-signing-key-change-me-0123456789}
# Loads sample data from spec section 5.5 (db/seed/V100__sample_data.sql)
spring.flyway.locations=classpath:db/migration,classpath:db/seed
