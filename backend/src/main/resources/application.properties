spring.application.name=healthdekho-backend
spring.profiles.default=dev
server.port=${SERVER_PORT:8080}
# Machine-specific secrets (DB password, AWS keys) live in backend/local.properties, which is git-ignored.
spring.config.import=optional:file:./local.properties

# ---------- Datasource (values come from the environment; see README) ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/healthdekho}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA: schema is owned by Flyway, Hibernate only validates ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- Spring AI: Claude on Amazon Bedrock (Converse API) ----------
spring.ai.model.chat=bedrock-converse
spring.ai.bedrock.aws.region=${AWS_REGION:us-east-1}
# Leave both empty to use the AWS default credential chain (env vars, ~/.aws profile/SSO, IAM role).
spring.ai.bedrock.aws.access-key=${AWS_ACCESS_KEY_ID:}
spring.ai.bedrock.aws.secret-key=${AWS_SECRET_ACCESS_KEY:}
spring.ai.bedrock.aws.session-token=${AWS_SESSION_TOKEN:}
spring.ai.bedrock.converse.chat.options.model=${BEDROCK_MODEL_ID:anthropic.claude-opus-5-5}
spring.ai.bedrock.converse.chat.options.max-tokens=16000
# No temperature/top-p/top-k: current Claude models reject sampling parameters.
# Fail fast: a customer is waiting on this call
spring.ai.bedrock.aws.timeout=60s

# ---------- HealthDekho business settings ----------
healthdekho.payment.grace-period-months=1
healthdekho.payment.late-penalty-rate=0.10
healthdekho.policy.number-prefix=HDP
healthdekho.ai.prompt-version=rec-v1
healthdekho.ai.model-version=${AI_MODEL_VERSION:deployment-v1}
healthdekho.ai.max-recommendations=3
healthdekho.search.max-page-size=50
healthdekho.search.default-page-size=10
healthdekho.security.jwt-secret=${JWT_SECRET:}
healthdekho.security.token-validity=60m
healthdekho.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
